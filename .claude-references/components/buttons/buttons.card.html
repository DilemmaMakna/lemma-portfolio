<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  body{margin:0;padding:24px 28px;background:var(--surface-paper);font-family:var(--font-sans);color:var(--text-body)}
  .grid{display:grid;grid-template-columns:auto 1fr;gap:14px 28px;align-items:center}
  .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton } = window.LemmaDesignSystem_e5b9a2;
  const Arrow = () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>

  ReactDOM.createRoot(document.getElementById('root')).render(
    <div className="grid">
      <div className="lbl">Primary</div>
      <div className="row">
        <Button>Start a project</Button>
        <Button size="lg">Explore showcase</Button>
        <Button size="sm">Compact</Button>
      </div>
      <div className="lbl">Accent</div>
      <div className="row">
        <Button variant="accent" size="lg" trailingIcon={<Arrow/>}>Selected work</Button>

      </div>
      <div className="lbl">Ghost</div>
      <div className="row">
        <Button variant="ghost" size="lg" trailingIcon={<Arrow/>}>Selected work</Button>

      </div>
      <div className="lbl">Deep CTA</div>
      <div className="row">
        <div className="stage-dark">
          <Button variant="deep" size="lg">Work with us</Button>
          <IconButton variant="deep" size="lg" ariaLabel="Open"/>
        </div>
      </div>
      <div className="lbl">IconButton</div>
      <div className="row">
        <IconButton variant="primary" ariaLabel="x"/>
        <IconButton variant="accent" ariaLabel="x"/>
        <IconButton variant="ghost" ariaLabel="x"/>
        <IconButton variant="primary" size="sm" ariaLabel="x"/>
        <IconButton variant="accent" size="lg" ariaLabel="x"/>
      </div>
    </div>
  );
</script>
