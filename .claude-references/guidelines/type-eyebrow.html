<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>

  .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
  .eyebrow{font-size:15px;line-height:1.7;letter-spacing:.13em;color:rgba(14,13,12,0.5);font-weight:400}
  .eyebrow.warm{color:#fadccb}
  .row{display:flex;gap:40px}
  .demo{background:var(--orange-900);padding:14px 18px;border-radius:12px}
  .title-after{font-size:20px;font-weight:500;color:var(--neutral-800);margin-top:4px}
</style></head><body>
  <div class="meta">Eyebrow / meta · 15 · 13% tracking</div>
  <div class="row">
    <div>
      <div class="eyebrow">Identitas Visual — 2025</div>
      <div class="title-after">BEM FAHUTAN IPB University</div>
    </div>
    <div class="demo">
      <div class="eyebrow warm">Kontak &amp; Tindak</div>
    </div>
  </div>
</body></html>
