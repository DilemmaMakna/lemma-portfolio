<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:0;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1fr 1fr;height:180px}
  .a{background:var(--beige-100);display:flex;align-items:center;justify-content:center;color:var(--neutral-ink)}
  .b{background:var(--orange-900);display:flex;align-items:center;justify-content:center;color:var(--beige-100)}
  .wm{font-family:var(--font-sans);font-weight:500;font-size:64px;letter-spacing:-0.02em;line-height:1}
</style></head><body>
  <div class="grid">
    <div class="a"><div class="wm">Lemma</div></div>
    <div class="b"><div class="wm">Lemma</div></div>
  </div>
</body></html>
