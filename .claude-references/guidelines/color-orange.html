<!-- @dsCard group="Colors" viewport="700x150" name="Brand Orange" subtitle="Signature warm primary — used for radial backdrops, accents, and links" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-paper);font-family:var(--font-sans);color:var(--text-body)}
  .row{display:flex;gap:8px}
  .sw{flex:1;height:88px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--neutral-0);font-size:11px;letter-spacing:.02em}
  .sw.dim{color:var(--neutral-ink)}
  .sw small{display:block;opacity:.75;font-size:10px;font-weight:300}
  .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase}
</style></head><body>
  <div class="lbl"><span>Orange · primary</span><span>50 → 900</span></div>
  <div class="row">
    <div class="sw dim" style="background:var(--orange-50)">50<small>#fff4ec</small></div>
    <div class="sw dim" style="background:var(--orange-100)">100<small>#ffdecb</small></div>
    <div class="sw dim" style="background:var(--orange-200)">200<small>#ffc7a7</small></div>
    <div class="sw dim" style="background:var(--orange-300)">300<small>#ffaa7c</small></div>
    <div class="sw" style="background:var(--orange-400)">400<small>#fb8839</small></div>
    <div class="sw" style="background:var(--orange-500)">500<small>#f97316</small></div>
    <div class="sw" style="background:var(--orange-600)">600<small>#e05e01</small></div>
    <div class="sw" style="background:var(--orange-700)">700<small>#c34c00</small></div>
    <div class="sw" style="background:var(--orange-800)">800<small>#913300</small></div>
    <div class="sw" style="background:var(--orange-900)">900<small>#46200a</small></div>
  </div>
</body></html>
