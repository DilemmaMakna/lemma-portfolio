<!-- @dsCard group="Type" viewport="700x160" name="Weight palette" subtitle="General Sans 300 / 400 / 500 — the three weights Lemma actually uses" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--surface-paper);font-family:var(--font-sans);color:var(--neutral-ink)}
  table{border-collapse:collapse;width:100%}
  td{padding:10px 0;border-bottom:1px solid var(--border-hairline);vertical-align:baseline}
  td.k{width:140px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
  td.v{font-size:36px;line-height:1.05}
  .w3{font-weight:300}.w4{font-weight:400}.w5{font-weight:500}
</style></head><body>
  <table>
    <tr><td class="k">Light · 300</td><td class="v w3">Empower your value</td></tr>
    <tr><td class="k">Regular · 400</td><td class="v w4">Empower your value</td></tr>
    <tr><td class="k">Medium · 500</td><td class="v w5">Empower your value</td></tr>
  </table>
</body></html>
