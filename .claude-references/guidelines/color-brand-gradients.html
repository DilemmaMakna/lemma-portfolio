<!-- @dsCard group="Colors" viewport="700x190" name="Brand gradient surfaces" subtitle="Radial orange + footer fade — the load-bearing brand surfaces" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-paper);font-family:var(--font-sans);color:var(--text-body)}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .sw{height:120px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:var(--neutral-0);font-size:12px}
  .sw small{display:block;opacity:.85;font-weight:300;font-size:10px}
  .a{background:var(--grad-orange-radial)}
  .b{background:linear-gradient(180deg,#d65801 0%,#d62501 100%)}
  .c{background:var(--orange-900)}
  .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase}
</style></head><body>
  <div class="lbl"><span>Brand gradients</span><span>For full-bleed sections</span></div>
  <div class="row">
    <div class="sw a">Hero radial<small>--grad-orange-radial</small></div>
    <div class="sw b">Solid hero<small>linear · 309° → 191°</small></div>
    <div class="sw c">Footer deep<small>--surface-deep · #46200a</small></div>
  </div>
</body></html>
