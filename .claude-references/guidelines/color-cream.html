<!-- @dsCard group="Colors" viewport="700x140" name="Cream paper" subtitle="Warm off-whites — the canvas Lemma sits on" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--neutral-100);font-family:var(--font-sans);color:var(--text-body)}
  .row{display:flex;gap:8px}
  .sw{flex:1;height:80px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:11px;color:var(--neutral-ink);outline:1px solid var(--border-hairline)}
  .sw small{display:block;opacity:.55;font-size:10px;font-weight:300}
  .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase}
</style></head><body>
  <div class="lbl"><span>Beige · paper</span><span>Cream surfaces</span></div>
  <div class="row">
    <div class="sw" style="background:var(--beige-0)">beige-0<small>#ffffff</small></div>
    <div class="sw" style="background:var(--beige-50)">beige-50<small>#fff8f3 · warm paper</small></div>
    <div class="sw" style="background:var(--beige-100)">beige-100<small>#f7f5f1 · cream</small></div>
    <div class="sw" style="background:var(--beige-200)">beige-200<small>#f1ece4</small></div>
  </div>
</body></html>
