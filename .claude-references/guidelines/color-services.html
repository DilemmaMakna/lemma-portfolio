<!-- @dsCard group="Colors" viewport="700x190" name="Service accents" subtitle="Magenta / olive / teal — reserved for immersive service tiles only" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-paper);font-family:var(--font-sans);color:var(--text-body)}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .swatch{height:120px;border-radius:14px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:var(--neutral-0);font-size:12px;letter-spacing:.02em}
  .swatch small{display:block;opacity:.85;font-weight:300;font-size:10px}
  .m{background:var(--grad-magenta-radial)}
  .o{background:var(--grad-olive-radial)}
  .t{background:radial-gradient(ellipse 70.71% 53.85% at 50% 50%, var(--teal-from) 0%, var(--teal-to) 100%)}
  .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase}
</style></head><body>
  <div class="lbl"><span>Service accents</span><span>One per service · never UI</span></div>
  <div class="row">
    <div class="swatch m">Creative &amp; Design<small>magenta · #d700d4 → #a900d7</small></div>
    <div class="swatch t">Data Analytics<small>teal · #017988 → #01d5dd</small></div>
    <div class="swatch o">Digital Solutions<small>olive · #d0d700 → #d7ac00</small></div>
  </div>
</body></html>
