<!-- @dsCard group="Spacing" viewport="700x200" name="Marketing rhythm" subtitle="64 gutter · 42 stack · 1312 inner · 1440 max" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-paper);font-family:var(--font-sans);color:var(--text-body)}
  .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
  .frame{position:relative;background:var(--neutral-0);outline:1px solid var(--border-soft);border-radius:8px;height:160px;width:660px;display:grid;grid-template-columns:64px 1fr 64px;overflow:hidden}
  .pad{background:repeating-linear-gradient(45deg,var(--orange-100) 0 6px,transparent 6px 12px)}
  .inner{padding:14px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
  .h{height:18px;background:var(--neutral-200);border-radius:4px;width:60%}
  .p{height:10px;background:var(--neutral-200);border-radius:4px;width:90%}
  .p+.p{width:78%}
  .tag{position:absolute;font-size:10px;color:var(--text-muted);font-weight:300}
</style></head><body>
  <div class="meta">Section layout · padding 64 · gap 42</div>
  <div class="frame">
    <div class="pad"></div>
    <div class="inner">
      <div class="h"></div>
      <div><div class="p"></div><div class="p" style="margin-top:8px"></div></div>
      <div class="h" style="width:30%;background:var(--orange-500)"></div>
    </div>
    <div class="pad"></div>
    <div class="tag" style="top:4px;left:18px">gutter 64</div>
    <div class="tag" style="top:4px;right:18px">gutter 64</div>
  </div>
</body></html>
