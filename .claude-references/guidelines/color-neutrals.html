<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Warm-biased ink and gray scale for text, borders, surfaces" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-paper);font-family:var(--font-sans);color:var(--text-body)}
  .row{display:flex;gap:8px}
  .sw{flex:1;height:88px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:var(--neutral-0);font-size:11px}
  .sw.dim{color:var(--neutral-ink)}
  .sw small{display:block;opacity:.75;font-size:10px;font-weight:300}
  .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:8px;letter-spacing:.12em;text-transform:uppercase}
</style></head><body>
  <div class="lbl"><span>Neutral · ink + surfaces</span><span>0 → ink</span></div>
  <div class="row">
    <div class="sw dim" style="background:var(--neutral-0);outline:1px solid var(--border-soft)">0<small>#ffffff</small></div>
    <div class="sw dim" style="background:var(--neutral-100)">100<small>#f5f5f5</small></div>
    <div class="sw dim" style="background:var(--neutral-200)">200<small>#e5e5e5</small></div>
    <div class="sw dim" style="background:var(--neutral-300)">300<small>#d4d4d4</small></div>
    <div class="sw dim" style="background:var(--neutral-400)">400<small>#a3a3a3</small></div>
    <div class="sw" style="background:var(--neutral-500)">500<small>#737373</small></div>
    <div class="sw" style="background:var(--neutral-600)">600<small>#525252</small></div>
    <div class="sw" style="background:var(--neutral-700)">700<small>#404040</small></div>
    <div class="sw" style="background:var(--neutral-800)">800<small>#262626</small></div>
    <div class="sw" style="background:var(--neutral-ink)">ink<small>#0e0d0c</small></div>
  </div>
</body></html>
